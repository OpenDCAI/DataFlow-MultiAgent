[project]
name = "dataflow-multi-agents"
version = "1.0.0"
description = "Multiple Codex agents for composing DataFlow pipelines"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20", "pandas>=2,<4", "rich>=13", "tqdm>=4", "xxhash>=3", "colorlog>=6", "rapidfuzz>=3.0", "open-dataflow==1.0.10"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
test = ["httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataflow_agents*"]

[project.scripts]
dataflow-agents = "dataflow_agents.cli:main"
dataflow-agents-web = "dataflow_agents.web:main"

[tool.pytest.ini_options]
pythonpath = ["."]
